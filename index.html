<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>旅の地図</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="page">
    <h1>写真の読み取り確認</h1>
    <p class="lead">写真を数枚選ぶと、位置情報と撮影時刻が読み取れたかを一覧で表示します。写真はこの端末の中だけで処理され、どこにも送信されません。</p>

    <div class="toolbar">
      <label class="btn primary file-btn">写真ライブラリから選ぶ
        <input id="pick-photos" type="file" accept="image/*" multiple>
      </label>
      <label class="btn file-btn">ファイルから選ぶ(HEICのまま)
        <input id="pick-files" type="file" accept="image/jpeg,image/heic,image/heif,.jpg,.jpeg,.heic,.heif" multiple>
      </label>
      <button id="clear" class="btn" type="button">クリア</button>
    </div>

    <div class="panel">
      <h2>時刻の設定</h2>
      <div class="settings-grid">
        <label>時差情報がない写真のタイムゾーン
          <select id="tz" class="field"></select>
        </label>
        <label>写真の時刻補正(分)
          <input id="shift" class="field" type="number" inputmode="numeric" step="1" value="0">
        </label>
      </div>
      <p class="hint">カメラの時計がずれている場合は「時刻補正」で調整します(例: 5分遅れていたら 5)。</p>
    </div>

    <div id="progress" class="progress" hidden><div></div></div>
    <div id="result"></div>
  </main>
  <script type="module" src="js/app.js"></script>
</body>
</html>
